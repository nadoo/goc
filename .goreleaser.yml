version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: default
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    builds:
      - default
    wrap_in_directory: true
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

snapshot:
  name_template: '{{ incpatch .Version }}-dev-{{.ShortCommit}}'

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
